<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HALORA RIDE</title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/halora-icon.png"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================= */

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #0f172a 0%,
          #020617 45%,
          #000814 100%
        );

      color: #ffffff;

      min-height: 100vh;

      overflow: hidden;
    }


    /* =========================
       TOP BAR
    ========================= */

    .topbar {

      width: 100%;

      height: 70px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 20px;

      background: rgba(5, 10, 25, 0.85);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      border-bottom:
        1px solid rgba(255, 180, 40, 0.15);

      position: relative;

      z-index: 10;
    }


    /* =========================
       LOGO TEXT
    ========================= */

    .logo {

      font-size: 23px;

      font-weight: 800;

      letter-spacing: 1.5px;

      background:
        linear-gradient(
          45deg,
          #ffffff,
          #ffffff,
          #ffb700
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      background-clip: text;

      text-transform: uppercase;
    }


    /* =========================
       HERO
    ========================= */

    .hero {

      width: 100%;

      min-height:
        calc(100vh - 70px);

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      position: relative;
    }


    /* =========================
       VIDEO BOX
    ========================= */

    .hero-box {

      width: 100%;

      max-width: 520px;

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;
    }


    /* =========================
       VIDEO
    ========================= */

    .hero-video {

      width: 100%;

      max-width: 520px;

      max-height: 82vh;

      height: auto;

      object-fit: contain;

      display: block;

      border-radius: 20px;

      background: #000;

      box-shadow:

        0 0 20px
        rgba(255, 183, 0, 0.25),

        0 0 50px
        rgba(255, 183, 0, 0.12);

      border:
        1px solid
        rgba(255, 190, 50, 0.18);
    }


    /* =========================
       VIDEO LOADING
    ========================= */

    .video-loading {

      position: absolute;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      color: #ffb700;

      font-size: 15px;

      font-weight: 600;

      letter-spacing: 1px;

      pointer-events: none;

      opacity: 0;

      transition: 0.3s;
    }


    /* =========================
       BOTTOM GLOW
    ========================= */

    .bottom-glow {

      position: fixed;

      left: 50%;

      bottom: -150px;

      transform: translateX(-50%);

      width: 500px;

      height: 300px;

      background:
        radial-gradient(
          ellipse,
          rgba(255, 183, 0, 0.12),
          transparent 70%
        );

      pointer-events: none;

      z-index: 0;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .topbar {

        height: 62px;

        padding:
          0 16px;
      }

      .logo {

        font-size: 19px;

        letter-spacing: 1px;
      }

      .hero {

        min-height:
          calc(100vh - 62px);

        padding: 10px;
      }

      .hero-box {

        width: 100%;

        max-width: 100%;
      }

      .hero-video {

        width: 100%;

        max-width: 100%;

        max-height:
          calc(100vh - 85px);

        border-radius: 15px;
      }
    }


    /* =========================
       VERY SMALL SCREEN
    ========================= */

    @media (max-height: 650px) {

      .hero {

        padding: 5px;
      }

      .hero-video {

        max-height:
          calc(100vh - 75px);
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="topbar">

    <div class="logo">
      HALORA RIDE
    </div>

  </header>


  <!-- =========================
       MAIN VIDEO
  ========================= -->

  <main class="hero">

    <div class="hero-box">

      <video
        id="haloraVideo"
        class="hero-video"
        autoplay
        muted
        playsinline
        preload="auto"
      >

        <!--
          अपनी video का नाम यहाँ रखें
        -->

        <source
          <source src="./assets/HALORA_20260917_104007_0000.mp4" type="video/mp4">
        >

        आपका browser video support नहीं करता।

      </video>


      <div
        id="videoLoading"
        class="video-loading"
      >
        Loading...
      </div>

    </div>

  </main>


  <!-- Background glow -->

  <div class="bottom-glow"></div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const video =
      document.getElementById("haloraVideo");

    const loading =
      document.getElementById("videoLoading");


    /*
      Video खत्म होते ही
      Login Page खुलेगा
    */

    video.addEventListener(
      "ended",
      function () {

        window.location.href =
          "./login.html";

      }
    );


    /*
      Video load होने पर
      loading हटाएँ
    */

    video.addEventListener(
      "loadeddata",
      function () {

        loading.style.opacity = "0";

      }
    );


    /*
      अगर video play नहीं होती
      तो manually play करने की कोशिश
    */

    window.addEventListener(
      "load",
      function () {

        video.play().catch(
          function () {

            loading.style.opacity = "1";

          }
        );

      }
    );


    /*
      Video में error आने पर
      सीधे login page खोलें
    */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "HALORA video load नहीं हुई"
        );

      }
    );

  </script>


</body>

</html>
