<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>HALORA Admin - Trips</title>

<link
  rel="stylesheet"
  href="admin.css"
>

<style>

.trip-form {
  background:#151515;
  border:1px solid #292929;
  border-radius:20px;
  padding:22px;
  margin-bottom:30px;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group {
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group label {
  color:#bbb;
  font-weight:bold;
}

.form-group input,
.form-group textarea {
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #444;
  background:#0d0d0d;
  color:white;
  font-size:16px;
  box-sizing:border-box;
}

.form-group textarea {
  min-height:110px;
  resize:vertical;
}

.add-trip-btn {
  width:100%;
  margin-top:18px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#ff9800;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

.trip-list {
  display:grid;
  gap:18px;
}

@media(max-width:600px) {

  .form-grid {
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="admin-header">

<div>

<h1>HALORA</h1>

<p>Trip Management</p>

</div>


<div class="header-actions">

<a
href="admin.html"
class="back-btn"
>
← Dashboard
</a>

</div>

</header>



<main class="admin-container">


<section class="welcome-box">

<h2>🧳 Trips Management</h2>

<p>
Create and manage HALORA trips.
</p>

</section>



<section class="trip-form">

<h2>➕ Add New Trip</h2>


<form id="tripForm">


<div class="form-grid">


<div class="form-group">

<label>Trip Name *</label>

<input
type="text"
id="tripTitle"
placeholder="Kashmir Trip"
required
>

</div>


<div class="form-group">

<label>From *</label>

<input
type="text"
id="tripFrom"
placeholder="Jaipur"
required
>

</div>


<div class="form-group">

<label>Destination *</label>

<input
type="text"
id="tripDestination"
placeholder="Kashmir"
required
>

</div>


<div class="form-group">

<label>Price ₹ *</label>

<input
type="number"
id="tripPrice"
placeholder="12000"
min="0"
required
>

</div>


<div class="form-group">

<label>Start Date</label>

<input
type="date"
id="tripDate"
>

</div>


<div class="form-group">

<label>End Date</label>

<input
type="date"
id="tripEndDate"
>

</div>


<div class="form-group">

<label>Duration</label>

<input
type="text"
id="tripDuration"
placeholder="5 Days / 4 Nights"
>

</div>


<div class="form-group">

<label>Total Seats</label>

<input
type="number"
id="tripSeats"
placeholder="20"
min="0"
>

</div>


<div class="form-group">

<label>Trip Image URL</label>

<input
type="url"
id="tripImage"
placeholder="https://..."
>

</div>


<div class="form-group">

<label>Description</label>

<textarea
id="tripDescription"
placeholder="Trip ke baare mein details..."
></textarea>

</div>


</div>


<button
type="submit"
class="add-trip-btn"
>
🚀 Add Trip
</button>


</form>

</section>



<section class="admin-section">

<h2>🧳 All Trips</h2>


<div
id="tripList"
class="trip-list"
>

<p>Loading trips...</p>

</div>

</section>


</main>



<script
type="module"
src="./trips-admin.js"
></script>


<script>

document
.getElementById("tripForm")
.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    addTrip();

  }
);

</script>


</body>

</html>
