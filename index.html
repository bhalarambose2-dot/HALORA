<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HALORA RIDE</title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/file_0000000043f08211a4b2f2ae3238c0b5.png"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================= */

    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #101a30 0%,
          #030914 45%,
          #00040a 100%
        );

      color: #ffffff;

      min-height: 100vh;

      overflow: hidden;
    }


    /* =========================
       TOP BAR
    ========================= */

    .topbar {

      width: 100%;

      height: 70px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0 20px;

      background:
        rgba(5, 10, 25, 0.88);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(255, 183, 0, 0.18);

      position: relative;

      z-index: 10;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      font-size: 23px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;

      background:
        linear-gradient(
          45deg,
          #ffffff 20%,
          #ffffff 45%,
          #ffb700 75%,
          #ff9900 100%
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      background-clip: text;

      filter:
        drop-shadow(
          0 0 8px
          rgba(255, 183, 0, 0.25)
        );
    }


    /* =========================
       HERO
    ========================= */

    .hero {

      width: 100%;

      min-height:
        calc(100vh - 70px);

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

      position: relative;

      z-index: 2;
    }


    /* =========================
       HERO BOX
    ========================= */

    .hero-box {

      width: 100%;

      max-width: 520px;

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;
    }


    /* =========================
       VIDEO
    ========================= */

    .hero-video {

      width: 100%;

      max-width: 520px;

      height: auto;

      max-height:
        calc(100vh - 95px);

      object-fit: contain;

      display: block;

      border-radius: 20px;

      background: #000000;

      border:
        1px solid
        rgba(255, 183, 0, 0.20);

      box-shadow:

        0 0 20px
        rgba(255, 183, 0, 0.30),

        0 0 50px
        rgba(255, 183, 0, 0.12);

      animation:
        videoGlow 3s
        ease-in-out
        infinite;
    }


    /* =========================
       VIDEO GLOW
    ========================= */

    @keyframes videoGlow {

      0% {

        box-shadow:
          0 0 20px
          rgba(255, 183, 0, 0.20);
      }

      50% {

        box-shadow:
          0 0 35px
          rgba(255, 183, 0, 0.40);
      }

      100% {

        box-shadow:
          0 0 20px
          rgba(255, 183, 0, 0.20);
      }
    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      position: fixed;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 20;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #ffb700;

      background:
        rgba(0,0,0,0.55);

      padding:
        12px 20px;

      border-radius: 30px;

      opacity: 0;

      pointer-events: none;

      transition: 0.3s;
    }


    /* =========================
       BOTTOM GLOW
    ========================= */

    .bottom-glow {

      position: fixed;

      left: 50%;

      bottom: -180px;

      transform:
        translateX(-50%);

      width: 600px;

      height: 350px;

      background:
        radial-gradient(
          ellipse,
          rgba(255, 183, 0, 0.12),
          transparent 70%
        );

      pointer-events: none;

      z-index: 1;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .topbar {

        height: 62px;

        padding: 0 15px;
      }

      .logo {

        font-size: 20px;

        letter-spacing: 1.5px;
      }

      .hero {

        min-height:
          calc(100vh - 62px);

        padding: 8px;
      }

      .hero-box {

        width: 100%;

        max-width: 100%;
      }

      .hero-video {

        width: 100%;

        max-width: 100%;

        max-height:
          calc(100vh - 78px);

        border-radius: 15px;
      }
    }


    /* =========================
       SMALL HEIGHT MOBILE
    ========================= */

    @media (max-height: 650px) {

      .hero {

        padding: 5px;
      }

      .hero-video {

        max-height:
          calc(100vh - 70px);
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="topbar">

    <div class="logo">
      HALORA RIDE
    </div>

  </header>


  <!-- =========================
       VIDEO SECTION
  ========================= -->

  <main class="hero">

    <div class="hero-box">

      <video
        id="haloraVideo"
        class="hero-video"
        autoplay
        muted
        playsinline
        preload="auto"
      >

        <!-- YOUR UPLOADED VIDEO -->

        <source
          src="./assets/HALORA_20260917_104007_0000.mp4"
          type="video/mp4"
        >

        आपका browser video support नहीं करता।

      </video>

    </div>

  </main>


  <!-- =========================
       LOADING
  ========================= -->

  <div
    id="loading"
    class="loading"
  >
    Loading HALORA...
  </div>


  <!-- =========================
       GLOW
  ========================= -->

  <div class="bottom-glow"></div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const video =
      document.getElementById(
        "haloraVideo"
      );

    const loading =
      document.getElementById(
        "loading"
      );


    /* =========================
       VIDEO END
       OPEN LOGIN PAGE
    ========================= */

    video.addEventListener(
      "ended",
      function () {

        window.location.href =
          "./login.html";

      }
    );


    /* =========================
       VIDEO LOADED
    ========================= */

    video.addEventListener(
      "loadeddata",
      function () {

        loading.style.opacity = "0";

      }
    );


    /* =========================
       TRY AUTOPLAY
    ========================= */

    window.addEventListener(
      "load",
      function () {

        video.muted = true;

        video.play()
          .then(function () {

            console.log(
              "HALORA video started"
            );

          })
          .catch(function (error) {

            console.log(
              "Autoplay blocked:",
              error
            );

            loading.style.opacity = "1";

          });

      }
    );


    /* =========================
       VIDEO ERROR
    ========================= */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "HALORA video load error"
        );

        /*
          अगर video नहीं मिली,
          तो login page खोल दें
        */

        setTimeout(
          function () {

            window.location.href =
              "./login.html";

          },
          1500
        );

      }
    );

  </script>


</body>

</html>
