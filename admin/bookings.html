<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HALORA Admin - Bookings</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">

    <div>
      <h1>HALORA</h1>
      <p>Booking Management</p>
    </div>

    <div class="header-actions">

      <a href="admin.html" class="back-btn">
        ← Dashboard
      </a>

    </div>

  </header>


  <main class="admin-container">

    <section class="welcome-box">

      <h2>📦 All Bookings</h2>

      <p>
        View and manage all HALORA bookings.
      </p>

    </section>


    <!-- FILTERS -->

    <section class="admin-section">

      <div class="filter-bar">

        <select id="statusFilter">

          <option value="">
            All Status
          </option>

          <option value="Pending">
            Pending
          </option>

          <option value="Approved">
            Approved
          </option>

          <option value="Completed">
            Completed
          </option>

          <option value="Rejected">
            Rejected
          </option>

        </select>


        <select id="typeFilter">

          <option value="">
            All Types
          </option>

          <option value="ride">
            Ride
          </option>

          <option value="hotel">
            Hotel
          </option>

          <option value="trip">
            Trip
          </option>

        </select>


        <button
          class="filter-btn"
          onclick="loadBookings()">

          🔍 Filter

        </button>

      </div>

    </section>


    <!-- BOOKINGS -->

    <section class="admin-section">

      <div class="section-title">

        <h2>🚕 Booking List</h2>

      </div>


      <div
        id="bookingList"
        class="admin-list">

        <p>
          Loading bookings...
        </p>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="./bookings-admin.js">
  </script>

</body>

</html>
